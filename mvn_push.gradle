apply plugin: 'maven-publish'
apply plugin: 'signing'

def isReleaseBuild() {
    return !VERSION_NAME.contains("SNAPSHOT")
}

task sourceJar(type: Jar) {
    classifier = 'sources'
    from sourceSets.main.allJava
}

task javadocJar(type: Jar, dependsOn: javadoc) {
    classifier = 'javadoc'
    from javadoc.destinationDir
}

javadoc {
    failOnError = false
    options.addStringOption('Xdoclint:none', '-quiet')
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = GROUP
            artifactId = POM_ARTIFACT_ID
            version = VERSION_NAME
            from components.java
            artifact sourceJar
            artifact javadocJar

            pom {
                name = POM_NAME
                description = POM_DESCRIPTION
                url = POM_URL
                inceptionYear = POM_INCEPTION_YEAR
                licenses {
                    license {
                        name = POM_LICENCE_NAME
                        url = POM_LICENCE_URL
                        distribution = 'repo'
                    }
                }
                developers {
                    developer {
                        id = POM_DEVELOPER_ID
                        name = POM_DEVELOPER_NAME
                        email = POM_EMAIL
                    }
                }
                scm {
                    connection = POM_SCM_CONNECTION
                    developerConnection = POM_SCM_DEV_CONNECTION
                    url = POM_SCM_URL
                }
            }
        }
    }
    repositories {
        mavenLocal()
    }
}

signing {
    required = { isReleaseBuild() }
    sign publishing.publications.mavenJava
}

// 打包上传变量
def bundleDir = file("${buildDir}/central-bundle")
def uploadZip = file("${bundleDir}/${POM_ARTIFACT_ID}-${VERSION_NAME}.zip")
def userM2Repo = file(System.getProperty("user.home") + "/.m2/repository")
def groupPath = GROUP.replace(".", "/")

// 修复后打包任务（无类型转换报错）
task buildBundle(type: Zip, dependsOn: publishMavenJavaPublicationToMavenLocal) {
    destinationDirectory = bundleDir
    archiveName = uploadZip.name

    def artifactDir = new File(userM2Repo, "${groupPath}/${POM_ARTIFACT_ID}/${VERSION_NAME}")
    from(artifactDir) {
        into "${groupPath}/${POM_ARTIFACT_ID}/${VERSION_NAME}"
        // 包含所有文件：jar pom asc md5 sha1 sha256 sha512 module
        include "*"
    }

    doLast {
        println("生成上传压缩包：" + uploadZip.absolutePath)
    }
}


task uploadToCentral(type: Exec, dependsOn: buildBundle) {
    doFirst {
        def tokenUser = project.hasProperty("CENTRAL_TOKEN_USER") ? project.property("CENTRAL_TOKEN_USER") : ""
        def tokenPwd = project.hasProperty("CENTRAL_TOKEN_PASS") ? project.property("CENTRAL_TOKEN_PASS") : ""
        if (tokenUser.isEmpty() || tokenPwd.isEmpty()) {
            throw new GradleException("缺少 CENTRAL_TOKEN_USER / CENTRAL_TOKEN_PASS 参数")
        }
        if (!uploadZip.exists()) {
            throw new GradleException("打包文件不存在：" + uploadZip.absolutePath)
        }
    }
    commandLine(
            'curl', '--fail', '-s', '-X', 'POST',
            '-u', "${CENTRAL_TOKEN_USER}:${CENTRAL_TOKEN_PASS}",
            '-F', "bundle=@${uploadZip.absolutePath}",
            '-F', "publishingType=${isReleaseBuild() ? 'USER_MANAGED' : 'AUTOMATIC'}",
            'https://central.sonatype.com/api/v1/publisher/upload'
    )
}
